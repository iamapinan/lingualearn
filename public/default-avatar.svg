<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- Head -->
  <circle cx="100" cy="75" r="32" fill="#FFFFFF"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="135" rx="50" ry="55" fill="#FFFFFF"/>
  
  <!-- Simple face - eyes -->
  <circle cx="88" cy="70" r="4" fill="#6366F1"/>
  <circle cx="112" cy="70" r="4" fill="#6366F1"/>
  
  <!-- Simple smile -->
  <path d="M 85 80 Q 100 90 115 80" stroke="#6366F1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>

