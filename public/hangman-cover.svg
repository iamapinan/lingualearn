<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#F0F4FF"/>
  
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Hangman Stand -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <!-- Base -->
    <line x1="80" y1="240" x2="180" y2="240" />
    <!-- Pole -->
    <line x1="130" y1="240" x2="130" y2="60" />
    <!-- Top beam -->
    <line x1="130" y1="60" x2="200" y2="60" />
    <!-- Rope -->
    <line x1="200" y1="60" x2="200" y2="90" />
  </g>
  
  <!-- Head -->
  <circle cx="200" cy="105" r="15" stroke="#EF4444" stroke-width="3" fill="none"/>
  
  <!-- Body -->
  <line x1="200" y1="120" x2="200" y2="170" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Arms -->
  <line x1="200" y1="135" x2="180" y2="150" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="135" x2="220" y2="150" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Legs -->
  <line x1="200" y1="170" x2="185" y2="195" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="170" x2="215" y2="195" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Word blanks -->
  <g fill="#334155">
    <rect x="260" y="120" width="25" height="4" rx="2"/>
    <rect x="290" y="120" width="25" height="4" rx="2"/>
    <rect x="320" y="120" width="25" height="4" rx="2"/>
    <rect x="350" y="120" width="25" height="4" rx="2"/>
    
    <rect x="260" y="140" width="25" height="4" rx="2"/>
    <rect x="290" y="140" width="25" height="4" rx="2"/>
    <rect x="320" y="140" width="25" height="4" rx="2"/>
    <rect x="350" y="140" width="25" height="4" rx="2"/>
  </g>
  
  <!-- Letters guessed -->
  <text x="275" y="118" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#6366F1">H</text>
  <text x="335" y="118" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#6366F1">L</text>
  <text x="305" y="138" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#6366F1">E</text>
  
  <!-- Wrong letters -->
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Wrong:</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#EF4444">A, T, S</text>
  
  <!-- Title -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#334155">HANGMAN</text>
</svg>

