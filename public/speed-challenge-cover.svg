<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#FFF7ED"/>
  
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="timerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B" />
      <stop offset="100%" style="stop-color:#EF4444" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#speedGradient)"/>
  
  <!-- Speed lines (motion effect) -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.3">
    <line x1="30" y1="50" x2="80" y2="50" />
    <line x1="40" y1="80" x2="100" y2="80" />
    <line x1="35" y1="110" x2="90" y2="110" />
    <line x1="320" y1="190" x2="370" y2="190" />
    <line x1="310" y1="220" x2="360" y2="220" />
  </g>
  
  <!-- Stopwatch/Timer -->
  <g transform="translate(200, 100)">
    <!-- Timer body -->
    <circle cx="0" cy="0" r="50" fill="url(#timerGradient)" stroke="#DC2626" stroke-width="4"/>
    <circle cx="0" cy="0" r="45" fill="#FEF3C7" stroke="#FBBF24" stroke-width="2"/>
    
    <!-- Timer button -->
    <rect x="-8" y="-65" width="16" height="12" rx="3" fill="#DC2626"/>
    
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="10" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#DC2626"/>
    
    <!-- Timer marks -->
    <circle cx="0" cy="-35" r="2" fill="#DC2626"/>
    <circle cx="35" cy="0" r="2" fill="#DC2626"/>
    <circle cx="0" cy="35" r="2" fill="#DC2626"/>
    <circle cx="-35" cy="0" r="2" fill="#DC2626"/>
  </g>
  
  <!-- Word cards with translation -->
  <g transform="translate(70, 180)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="90" height="50" rx="8" fill="white" stroke="#F59E0B" stroke-width="2"/>
    <text x="45" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Hello</text>
    <line x1="10" y1="28" x2="80" y2="28" stroke="#E5E7EB" stroke-width="1"/>
    <text x="45" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">สวัสดี</text>
  </g>
  
  <g transform="translate(240, 180)">
    <!-- Card 2 -->
    <rect x="0" y="0" width="90" height="50" rx="8" fill="white" stroke="#EF4444" stroke-width="2"/>
    <text x="45" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Cat</text>
    <line x1="10" y1="28" x2="80" y2="28" stroke="#E5E7EB" stroke-width="1"/>
    <text x="45" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">แมว</text>
  </g>
  
  <!-- Lightning bolts for speed -->
  <g fill="#FBBF24">
    <path d="M 350 70 L 340 90 L 350 90 L 345 105 L 360 85 L 350 85 Z" opacity="0.7"/>
    <path d="M 50 170 L 42 185 L 50 185 L 46 197 L 58 180 L 50 180 Z" opacity="0.5"/>
  </g>
  
  <!-- Score display -->
  <g transform="translate(200, 30)">
    <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">⚡ 150</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#DC2626">SPEED CHALLENGE</text>
</svg>

