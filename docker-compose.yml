version: '3.8'

services:
  lingualearn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DB_HOST=db
        - DB_PORT=3306
        - DB_USER=${MYSQL_USER:-lingualearn}
        - DB_PASSWORD=${MYSQL_PASSWORD:-lingualearn123}
        - DB_NAME=lingualearn_db
        - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-in-production}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3010}
    container_name: lingualearn-app
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-lingualearn}
      - DB_PASSWORD=${MYSQL_PASSWORD:-lingualearn123}
      - DB_NAME=lingualearn_db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this-in-production}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3010}
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - lingualearn-network

  db:
    image: mysql:8.0
    container_name: lingualearn-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=lingualearn_db
      - MYSQL_USER=${MYSQL_USER:-lingualearn}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-lingualearn123}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/lingualearn.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/verbs-extended.sql:/docker-entrypoint-initdb.d/02-verbs.sql
    restart: unless-stopped
    networks:
      - lingualearn-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql-data:
    driver: local

networks:
  lingualearn-network:
    driver: bridge

